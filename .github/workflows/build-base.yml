name: Build Base Image

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - 'runtime/**'
      - 'task/handler.sh'
      - '.github/workflows/build-base.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'runtime/**'
      - 'task/handler.sh'

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base:
    runs-on: ubuntu-latest
    env:
      HTTP_CLI_VERSION: v1.1.0
      # Push to GHCR only on pushes to branches, never on pull_request events.
      # Pull requests (especially Dependabot's) cannot read the repo secrets
      # needed to authenticate, so they build for validation only.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push base
        run: |
          if [ "${{ env.PUSH }}" = "true" ]; then
            echo "${{ secrets.GHCR_PAT }}" > github_token
            OUTPUT_FLAG="--push"
          else
            # No secrets available on PRs; provide a dummy secret file so the
            # --secret mount resolves, and build without pushing.
            echo "" > github_token
            OUTPUT_FLAG="--output=type=cacheonly"
          fi
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --secret id=github_token,src=github_token \
            --build-arg HTTP_CLI_VERSION=${{ env.HTTP_CLI_VERSION }} \
            --target base \
            --tag ghcr.io/${{ github.repository_owner }}/lambda-shell-runtime:base \
            $OUTPUT_FLAG \
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
